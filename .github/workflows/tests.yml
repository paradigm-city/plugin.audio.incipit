name: Tests

on:
  push:
  pull_request:

jobs:
  unittest:
    # Windows: the add-on handles Windows library paths (D:\music\...) with os.path.
    runs-on: windows-latest
    strategy:
      matrix:
        # 3.8 is the interpreter bundled with Kodi on Windows; 3.x catches newer-version breakage.
        python-version: ["3.8", "3.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Kodi's Python has Pillow (the collages and charts are drawn with it); numpy is the sound engine's own.
      - name: Install Pillow and numpy
        run: python -m pip install pillow numpy
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
